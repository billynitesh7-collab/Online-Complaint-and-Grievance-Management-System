<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Grievance Management System</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="public-header">
    <a href="/" class="brand">
      <div class="brand-icon">🏛️</div>
      <span>College Grievance Portal</span>
    </a>
    <nav class="public-nav">
      <a href="/login.html" class="btn btn-secondary">Already registered? Log In</a>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <h1>Student Registration</h1>
        <p>Create an account to submit and track grievances</p>
      </div>

      <div id="alertContainer"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Full Name <span class="req">*</span></label>
          <input 
            type="text" 
            id="name" 
            class="form-control" 
            placeholder="e.g., Alex Johnson" 
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">College Email Address <span class="req">*</span></label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g., alex.j@college.edu" 
            required
            autocomplete="email"
          >
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label for="rollNumber" class="form-label">Roll Number <span class="req">*</span></label>
            <input 
              type="text" 
              id="rollNumber" 
              class="form-control" 
              placeholder="e.g., CS-2026-042" 
              required
            >
          </div>

          <div class="form-group">
            <label for="department" class="form-label">Department <span class="req">*</span></label>
            <input 
              type="text" 
              id="department" 
              class="form-control" 
              placeholder="e.g., Computer Science" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="req">*</span> <small style="color:var(--text-muted);font-weight:normal;">(min 6 chars)</small></label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Create a strong password" 
              required
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" data-target="password">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password <span class="req">*</span></label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-control" 
              placeholder="Re-enter your password" 
              required
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" data-target="confirmPassword">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register Account</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="/login.html">Log in here</a>
      </div>
    </div>
  </div>

  <footer class="public-footer">
    <p>&copy; 2026 College Grievance & Complaint Management System</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
