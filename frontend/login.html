<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Grievance Management System</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="public-header">
    <a href="/" class="brand">
      <div class="brand-icon">🏛️</div>
      <span>College Grievance Portal</span>
    </a>
    <nav class="public-nav">
      <a href="/register.html" class="btn btn-secondary">Student Register</a>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in with your college account credentials</p>
      </div>

      <div id="alertContainer"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="req">*</span></label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g., student@college.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="req">*</span></label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Enter your password" 
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" data-target="password">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
        Don't have a student account? <a href="/register.html">Register here</a>
      </div>
    </div>
  </div>

  <footer class="public-footer">
    <p>&copy; 2026 College Grievance & Complaint Management System</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
